version: 2

sources:
  - name: raw
    description: >
      Raw landing tables for the gaming analytics product: synthetic example
      data generated by agentic_data_analyst.data.generator.
    tables:
      - name: raw_players
        identifier: players
        description: Raw player account, acquisition, geography, and behavioral segment attributes.
        columns:
          - name: player_id
            description: Stable synthetic player identifier.
          - name: signup_at
            description: UTC account creation time.
          - name: segment
            description: Behavioral segment assigned at signup.
          - name: region
            description: Synthetic player region.
          - name: acquisition_channel
            description: Channel credited with acquisition.
      - name: raw_sessions
        identifier: sessions
        description: Raw player login sessions with duration and device context.
        columns:
          - name: session_id
            description: Stable synthetic session identifier.
          - name: player_id
            description: Player that opened the session.
          - name: session_start
            description: UTC session start time.
      - name: raw_events
        identifier: events
        description: Raw product telemetry events emitted during player sessions.
        columns:
          - name: event_id
            description: Stable synthetic event identifier.
          - name: session_id
            description: Session containing the event.

models:
  - name: stg_players
    description: >
      Cleaned, one-row-per-player staging model built directly from the raw
      player source. Curated entry point other models join against for
      player attributes.
    columns:
      - name: player_id
        description: Stable synthetic player identifier.
        tests: [unique, not_null]
      - name: segment
        description: Behavioral segment assigned at signup.
        tests:
          - accepted_values:
              values: ["casual", "core", "competitive"]

  - name: stg_sessions
    description: >
      Cleaned player session staging model built directly from the raw
      session source.
    columns:
      - name: session_id
        description: Stable synthetic session identifier.
        tests: [unique, not_null]
      - name: player_id
        description: Player that opened the session.
        tests:
          - not_null
          - relationships:
              to: ref('stg_players')
              field: player_id
