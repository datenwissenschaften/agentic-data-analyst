[project]
name = "agentic-data-analyst"
version = "0.1.0"
description = "A guarded natural-language-to-PySpark analytics reference architecture"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "agentic-data-analyst contributors" }]
keywords = ["analytics", "agents", "pyspark", "fastapi", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.13,<2",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "pyspark>=4.0,<4.3",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
examples = [
  "jupyter>=1.1,<2",
  "nbclient>=0.10,<1",
  "kaleido>=1.0,<2",
  "plotly>=5.24,<7",
]

[project.scripts]
agentic-data-generate = "agentic_data_analyst.data.generator:main"
agentic-data-mcp = "agentic_data_analyst.mcp.catalog_server:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "agentic_data_analyst", from = "src" }]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["integration: tests that exercise Spark and multiple application layers"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["agentic_data_analyst"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "pyarrow.*", "mcp.*"]
ignore_missing_imports = true
