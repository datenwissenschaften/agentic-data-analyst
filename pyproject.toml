[project]
name = "agentic-data-analyst"
version = "0.2.0"
description = "Chat with a speedrun database: Claude writes read-only DuckDB SQL and Chainlit shows tables and charts"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=2.3.0",
    "chainlit>=2.12.0",
    "duckdb>=1.4.0",
    "loguru>=0.7.3",
    "pandas>=2.0.0",
    "plotly>=6.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pandas-stubs",
    # pytest-bdd 9.0 uses pytest internals that 9.2 removed.
    "pytest<9.2",
    "pytest-bdd>=9.0.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_data_analyst"]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# plotly ships no type information.
module = ["plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
