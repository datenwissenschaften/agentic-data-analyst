name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Poetry
        run: python -m pip install 'poetry==2.3.1'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py312-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-py312-
      - name: Install locked dependencies
        run: poetry sync --extras dev --no-interaction
      - name: Ruff lint
        run: poetry run ruff check .
      - name: Ruff format
        run: poetry run ruff format --check .
      - name: Mypy
        run: poetry run mypy
      - name: Tests
        run: poetry run pytest
